<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>网页版 - 小有计划</title>
<meta name="description" content="小有计划网页版：轻点勾选、长按删除，计划保存在本机浏览器中。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E0764A'/%3E%3Cpath d='M9.5 16.5L14 21L22.5 11.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-body">

<div class="app-wrap">
  <!-- 顶部 -->
  <header class="app-header">
    <div class="app-title">
      <svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#E0764A"/><path d="M9.5 16.5L14 21L22.5 11.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <strong>我的计划</strong>
    </div>
    <a class="back-home" href="index.html">← 返回官网</a>
  </header>

  <div class="app-main">
    <!-- 进度卡 -->
    <div class="progress-card">
      <span id="progressText">—— · 已完成 0 / 0</span>
      <div class="bar"><i id="progressFill" style="width:0%"></i></div>
    </div>

    <!-- 输入栏 -->
    <div class="app-input">
      <span class="plus">＋</span>
      <input id="taskInput" type="text" placeholder="记一条计划，回车即可添加…" maxlength="60" />
      <button id="addBtn" class="add-btn" type="button">添加</button>
    </div>

    <!-- 标签页 -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="all">全部</button>
      <button class="tab" data-tab="todo">未完成</button>
      <button class="tab" data-tab="done">已完成</button>
    </div>

    <!-- 任务列表 -->
    <ul class="task-list" id="taskList"></ul>

    <!-- 空状态 -->
    <div class="empty" id="empty" hidden>
      <b>这里空空如也</b>
      <span>在上方输入框记下第一条计划吧</span>
    </div>

    <p class="app-tip">轻点勾选完成 · 悬停后点 × 删除 · 数据保存在本机浏览器</p>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
